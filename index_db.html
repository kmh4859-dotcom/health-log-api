<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이 헬스 로그 (DB)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2d6cdf; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { background: #2d6cdf; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; margin-right: 6px; }
        .record { border: 1px solid #ddd; padding: 12px; margin: 10px 0; border-radius: 6px; }
        .warning { color: #d33; font-weight: bold; }
        .section { margin-bottom: 28px; }
    </style>
</head>
<body>
    <h1>마이 헬스 로그 (DB)</h1>

    <div class="section">
        <h2>사용자 등록</h2>
        <input id="new_name" placeholder="이름">
        <input id="new_birth" type="number" placeholder="출생연도 (예: 1958)">
        <input id="new_gender" placeholder="성별 (남/여)">
        <button onclick="createUser()">등록</button>
    </div>

    <div class="section">
        <h2>사용자 선택</h2>
        <select id="user_select" onchange="refreshAll()"></select>
    </div>

    <div class="section">
        <h2>기록 입력</h2>
        <input id="date" placeholder="날짜 (예: 2026-07-22)">
        <input id="weight" type="number" placeholder="몸무게 (kg)">
        <input id="height" type="number" placeholder="키 (cm)">
        <input id="systolic" type="number" placeholder="수축기 혈압">
        <input id="diastolic" type="number" placeholder="이완기 혈압">
        <input id="blood_sugar" type="number" placeholder="공복 혈당">
        <input id="steps" type="number" placeholder="걸음 수">
        <input id="sleep_hours" type="number" placeholder="수면 시간">
        <button onclick="addRecord()">저장</button>
    </div>

    <div class="section">
        <h2>목표 관리</h2>
        <input id="target_weight" type="number" placeholder="목표 체중 (kg)">
        <button onclick="setGoal()">목표 설정</button>
        <div id="goal"></div>
    </div>

    <div class="section">
        <h2>기록 목록</h2>
        <button onclick="loadRecords()">새로고침</button>
        <div id="records"></div>
    </div>

    <script>
        async function loadUsers() {
            const res = await fetch("/users");
            const result = await res.json();
            const select = document.getElementById("user_select");
            select.innerHTML = "";
            for (const u of result.users) {
                const opt = document.createElement("option");
                opt.value = u.id;
                opt.textContent = u.name + " (id: " + u.id + ")";
                select.appendChild(opt);
            }
        }

        function getUserId() {
            return parseInt(document.getElementById("user_select").value);
        }

        async function createUser() {
            const data = {
                name: document.getElementById("new_name").value,
                birth_year: parseInt(document.getElementById("new_birth").value) || 0,
                gender: document.getElementById("new_gender").value
            };
            const res = await fetch("/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const err = await res.json();
                alert("등록 실패: " + err.detail);
                return;
            }
            await loadUsers();
            alert("등록되었습니다");
        }

        async function addRecord() {
            const data = {
                user_id: getUserId(),
                date: document.getElementById("date").value,
                weight: parseFloat(document.getElementById("weight").value),
                height: parseFloat(document.getElementById("height").value),
                systolic: parseInt(document.getElementById("systolic").value),
                diastolic: parseInt(document.getElementById("diastolic").value),
                blood_sugar: parseInt(document.getElementById("blood_sugar").value),
                steps: parseInt(document.getElementById("steps").value) || 0,
                sleep_hours: parseFloat(document.getElementById("sleep_hours").value) || 0
            };
            const res = await fetch("/records", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                alert("저장 실패: 모든 칸을 채워주세요");
                return;
            }
            loadRecords();
        }

        async function loadRecords() {
            const res = await fetch("/records?user_id=" + getUserId());
            const result = await res.json();
            let html = "";
            for (const r of result.records) {
                let warningText = "";
                if (r.warnings.length > 0) {
                    warningText = "<p class='warning'>⚠️ " + r.warnings.join(" / ") + "</p>";
                }
                html += "<div class='record'>" +
                    "<b>" + r.date + "</b> (id: " + r.id + ", " + r.user_name + ")<br>" +
                    "몸무게 " + r.weight + "kg, 키 " + r.height + "cm<br>" +
                    "BMI " + r.bmi + " (" + r.bmi_category + "), 혈압 " + r.bp_category + ", 혈당 " + r.sugar_category + "<br>" +
                    "걸음 " + r.steps + "보 (" + r.steps_category + "), 수면 " + r.sleep_hours + "시간 (" + r.sleep_category + ")" +
                    warningText +
                    "</div>";
            }
            document.getElementById("records").innerHTML = html;
        }

        async function setGoal() {
            const data = {
                user_id: getUserId(),
                goal_type: "weight",
                target_value: parseFloat(document.getElementById("target_weight").value)
            };
            await fetch("/goals", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            loadGoal();
        }

        async function loadGoal() {
            const res = await fetch("/goals?user_id=" + getUserId());
            const result = await res.json();
            let html = "";
            if (result.message) {
                html = "<p>" + result.message + "</p>";
            } else {
                html = "<div class='record'>";
                for (const g of result.goals) {
                    html += g.goal_type + " 목표: " + g.target_value + "<br>";
                }
                if (result.current_weight !== undefined) {
                    html += "현재 체중: " + result.current_weight + "kg<br>";
                }
                if (result.remaining !== undefined) {
                    html += "<b>남은 양: " + result.remaining + "kg</b>";
                }
                html += "</div>";
            }
            document.getElementById("goal").innerHTML = html;
        }

        async function refreshAll() {
            await loadRecords();
            await loadGoal();
        }

        (async function init() {
            await loadUsers();
            await refreshAll();
        })();
    </script>
</body>
</html>
